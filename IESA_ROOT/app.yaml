# ИСТОРИЧЕСКИЙ ЧЕРНОВИК, НЕ PRODUCTION APP SPEC.
# Имена и настройки ниже не совпадают с действующим iesaroot-app.
# С 2026-11-13 боты работают на отдельном Droplet/systemd.
# Актуальная конфигурация: ../docs/agent/03-hosting-and-deploy.md и экспорт из DO.
# Не загружать этот файл в App Platform как способ деплоя личных проектов.
name: iesa-app
services:
- name: iesa-web
  github:
    branch: master
    repo: Slawik88/IESA_ROOT
  source_dir: IESA_ROOT
  build_command: |
    pip install -r requirements.txt && \
    python manage.py collectstatic --clear --noinput
  run_command: sh start.sh
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xs
  envs:
  - key: DEBUG
    value: "False"
  - key: ALLOWED_HOSTS
    value: "*.ondigitalocean.app,iesa.app"
  - key: DATABASE_URL
    value: ${db.connection_string}
  # CleverReach email integration
  # All transactional emails (visit confirmation, password reset, etc.) go via CleverReach API.
  - key: CLEVERREACH_CLIENT_ID
    value: ""
    type: SECRET
  - key: CLEVERREACH_CLIENT_SECRET
    value: ""
    type: SECRET
  - key: CLEVERREACH_ACCESS_TOKEN
    value: ""
    type: SECRET
  - key: CLEVERREACH_REFRESH_TOKEN
    value: ""
    type: SECRET
  - key: CLEVERREACH_SENDER_EMAIL
    value: noreply@iesasport.ch
  - key: CLEVERREACH_SENDER_NAME
    value: IESA Sport
  # Telegram Bot (configure via @BotFather)
  - key: TELEGRAM_BOT_TOKEN
    value: ""
    type: SECRET
  - key: TELEGRAM_BOT_NAME
    value: IESA_ADMINISTRATOR_BOT
  - key: TELEGRAM_WEBHOOK_SECRET
    value: ""
    type: SECRET
  # Full public URL of this app — used to auto-register the Telegram webhook on startup
  - key: SITE_URL
    value: "https://iesasport.ch"
  - key: RUN_PREDVESTNIK_IN_WEB
    value: "0"
