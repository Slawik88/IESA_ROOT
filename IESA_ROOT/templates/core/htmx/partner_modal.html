{# V22: стили этого фрагмента вынесены в static/css/pages.css — <style> в HTMX-партиале реинжектится при каждом свапе #}
﻿{% load i18n %}
<div class="partner-details-modal">
  <!-- Header Section with Logo and Name -->
  <div class="partner-details-header">
    <div class="partner-details-logo">
      {% if partner.logo %}
        <img loading="lazy" src="{{ partner.logo.url }}" alt="{{ partner.name }}" class="partner-logo-img">
      {% else %}
        <div class="partner-logo-large">{{ partner.name|slice:":2"|upper }}</div>
      {% endif %}
    </div>
    <div class="partner-details-title">
      <span class="badge-partner mb-3 d-inline-block">{% trans "Strategic Partner" %}</span>
      <h3 class="fw-bold mb-2" style="color:#fff;">{{ partner.name }}</h3>
      <p style="color:rgba(255,255,255,.5);font-size:.95rem;margin:0;">{{ partner.description }}</p>
    </div>
  </div>

  <!-- Actions Section -->
  <div class="partner-details-actions">
    {% if partner.link %}
      <a href="{{ partner.link }}" target="_blank" rel="noopener" class="pm-btn-primary">
        <i class="fas fa-external-link-alt me-2"></i>{% trans "Visit Website" %}
      </a>
    {% else %}
      <div class="pm-alert pm-alert-info">
        <i class="fas fa-info-circle me-2"></i>
        {% trans "Website information will be added soon." %}
      </div>
    {% endif %}
  </div>

  <!-- Contract Section - Only shown if contract exists -->
  {% if partner.contract %}
  <div class="partner-details-contract">
    <h5 class="fw-bold mb-3" style="color:#fff;">
      <i class="fas fa-file-contract me-2" style="color:var(--primary);"></i>{% trans "Partnership Agreement" %}
    </h5>
    <div class="contract-preview">
      <img loading="lazy" src="{{ partner.contract.url }}" alt="{% trans "Contract" %}" class="contract-image">
      <div class="contract-actions">
        <a href="{{ partner.contract.url }}" target="_blank" download class="pm-btn-ghost" rel="noopener noreferrer">
          <i class="fas fa-download me-1"></i>{% trans "Download" %}
        </a>
        <a href="{{ partner.contract.url }}" target="_blank" class="pm-btn-ghost" rel="noopener noreferrer">
          <i class="fas fa-expand me-1"></i>{% trans "View Full Size" %}
        </a>
      </div>
    </div>
  </div>
  {% endif %}

  <!-- Footer Info -->
  <div class="partner-details-footer text-center" style="color:rgba(255,255,255,.3);font-size:.82rem;">
    <p class="mb-0">
      <i class="fas fa-handshake me-1"></i>
      {% trans "Partnership established to advance sports excellence and collaboration" %}
    </p>
  </div>
</div>
