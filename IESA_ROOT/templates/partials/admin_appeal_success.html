{% load i18n %}
<div id="appeal-form-wrap" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:12px;padding:22px 24px;text-align:center;">
  <div style="font-size:2rem;margin-bottom:.6rem;">✅</div>
  <div style="font-size:.95rem;font-weight:700;color:#4ade80;margin-bottom:.4rem;">{% trans "Appeal submitted!" %}</div>
  <div style="font-size:.82rem;color:rgba(255,255,255,.5);font-family:'Courier New',monospace;line-height:1.6;">
    {% trans "Thank you. The administration will review your request and contact you by e-mail." %}
  </div>
</div>
