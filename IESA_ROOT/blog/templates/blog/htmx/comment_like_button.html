<div id="comment-like-{{ comment.pk }}">
    <button type="button" style="background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:.25rem .65rem;color:{% if is_liked %}var(--primary){% else %}rgba(255,255,255,.45){% endif %};cursor:pointer;font-size:.8rem;transition:border-color .2s,color .2s;"
            hx-post="{% url 'blog:toggle_comment_like' pk=comment.post.pk comment_pk=comment.pk %}"
            hx-target="#comment-like-{{ comment.pk }}"
            hx-swap="outerHTML">
        <i class="fas fa-thumbs-up me-1"></i>
        <span>{{ like_count }}</span>
    </button>
</div>
