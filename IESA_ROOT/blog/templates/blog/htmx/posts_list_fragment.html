{# V22: стили этого фрагмента вынесены в static/css/pages.css — <style> в HTMX-партиале реинжектится при каждом свапе #}
{% load i18n %}

{% if posts %}
    <div class="row g-4">
    {% for post in posts %}

        {% if forloop.first %}
        {# ── Featured post: 2/3 width, horizontal layout ── #}
        <div class="col-12 col-lg-8">
            <div class="iesa-article iesa-article--featured" data-tilt>
                {% if post.preview_image %}
                    <div class="art-img-wrap">
                        <img src="{{ post.preview_image.url }}" class="art-img" alt="{{ post.title }}" loading="lazy">
                        <div class="art-img-overlay"></div>
                        <span class="art-cat"><i class="fas fa-star me-1"></i>{% trans "Featured" %}</span>
                        <span class="art-index"></span>
                        <span class="art-read-time"><i class="fas fa-book-open"></i><span class="art-read-time-val">…</span></span>
                    </div>
                {% else %}
                    <div class="art-no-image">
                        <i class="fas fa-newspaper"></i>
                        <span class="art-cat" style="position:absolute;top:.85rem;left:.85rem;"><i class="fas fa-star me-1"></i>{% trans "Featured" %}</span>
                        <span class="art-index" style="position:absolute;top:.85rem;right:.85rem;"></span>
                    </div>
                {% endif %}
                <div class="art-body">
                    <div class="art-title">{{ post.title }}</div>
                    <div class="art-excerpt">{{ post.text|striptags|truncatewords:30 }}</div>
                    <div class="art-progress-wrap">
                        <div class="art-progress-bar" data-views="{{ post.views_count }}"></div>
                    </div>
                    <div class="art-meta">
                        <span><i class="fas fa-eye"></i>{{ post.views_count }}</span>
                        <span><i class="fas fa-comment"></i>{{ post.comments.count }}</span>
                        <span><i class="fas fa-heart"></i>{{ post.likes.count }}</span>
                        <span style="margin-left:auto;font-size:.72rem;"><i class="fas fa-clock"></i>{{ post.created_at|timesince }} {% trans "ago" %}</span>
                    </div>
                </div>
                <div class="art-footer">
                    <div class="art-author">
                        <div class="art-author-av"><i class="fas fa-user"></i></div>
                        <span class="text-truncate">{{ post.author.username }}</span>
                    </div>
                    <a href="{% url 'blog:post_detail' pk=post.pk %}" class="art-btn">
                        {% trans "Read" %} <i class="fas fa-arrow-right" style="font-size:.7rem;"></i>
                    </a>
                </div>
            </div>
        </div>

        {% elif forloop.counter == 2 %}
        {# ── Second post: 1/3 width, fills alongside featured ── #}
        <div class="col-12 col-lg-4">
            <div class="iesa-article" data-tilt>
                {% if post.preview_image %}
                    <div class="art-img-wrap">
                        <img src="{{ post.preview_image.url }}" class="art-img" alt="{{ post.title }}" loading="lazy">
                        <div class="art-img-overlay"></div>
                        <span class="art-index"></span>
                        <span class="art-read-time"><i class="fas fa-book-open"></i><span class="art-read-time-val">…</span></span>
                    </div>
                {% else %}
                    <div class="art-no-image"><i class="fas fa-newspaper"></i></div>
                {% endif %}
                <div class="art-body">
                    <div class="art-title">{{ post.title }}</div>
                    <div class="art-excerpt">{{ post.text|striptags|truncatewords:18 }}</div>
                    <div class="art-progress-wrap">
                        <div class="art-progress-bar" data-views="{{ post.views_count }}"></div>
                    </div>
                    <div class="art-meta">
                        <span><i class="fas fa-eye"></i>{{ post.views_count }}</span>
                        <span><i class="fas fa-comment"></i>{{ post.comments.count }}</span>
                        <span><i class="fas fa-heart"></i>{{ post.likes.count }}</span>
                    </div>
                </div>
                <div class="art-footer">
                    <div class="art-author">
                        <div class="art-author-av"><i class="fas fa-user"></i></div>
                        <span class="text-truncate">{{ post.author.username }}</span>
                    </div>
                    <a href="{% url 'blog:post_detail' pk=post.pk %}" class="art-btn">
                        {% trans "Read" %} <i class="fas fa-arrow-right" style="font-size:.7rem;"></i>
                    </a>
                </div>
            </div>
        </div>

        {% else %}
        {# ── Standard grid post (3-column) ── #}
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="iesa-article" data-tilt>
                {% if post.preview_image %}
                    <div class="art-img-wrap">
                        <img src="{{ post.preview_image.url }}" class="art-img" alt="{{ post.title }}" loading="lazy">
                        <div class="art-img-overlay"></div>
                        <span class="art-index"></span>
                        <span class="art-read-time"><i class="fas fa-book-open"></i><span class="art-read-time-val">…</span></span>
                    </div>
                {% else %}
                    <div class="art-no-image"><i class="fas fa-newspaper"></i></div>
                {% endif %}
                <div class="art-body">
                    <div class="art-title">{{ post.title }}</div>
                    <div class="art-excerpt">{{ post.text|striptags|truncatewords:18 }}</div>
                    <div class="art-progress-wrap">
                        <div class="art-progress-bar" data-views="{{ post.views_count }}"></div>
                    </div>
                    <div class="art-meta">
                        <span><i class="fas fa-eye"></i>{{ post.views_count }}</span>
                        <span><i class="fas fa-comment"></i>{{ post.comments.count }}</span>
                        <span><i class="fas fa-heart"></i>{{ post.likes.count }}</span>
                    </div>
                </div>
                <div class="art-footer">
                    <div class="art-author">
                        <div class="art-author-av"><i class="fas fa-user"></i></div>
                        <span class="text-truncate">{{ post.author.username }}</span>
                    </div>
                    <a href="{% url 'blog:post_detail' pk=post.pk %}" class="art-btn">
                        {% trans "Read" %} <i class="fas fa-arrow-right" style="font-size:.7rem;"></i>
                    </a>
                </div>
            </div>
        </div>
        {% endif %}

    {% endfor %}
    </div>
{% else %}
    {# 4d: Улучшенный empty state при 0 результатах фильтрации #}
    <div class="text-center py-5" data-reveal
         style="background:rgba(255,255,255,.025);border:1.5px dashed rgba(255,255,255,.08);border-radius:20px;padding:3.5rem 2rem;max-width:480px;margin:2rem auto;">
        <div style="font-size:3rem;margin-bottom:.9rem;animation:gal-float 3s ease-in-out infinite;">🔍</div>
        <div style="font-size:.95rem;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:.4rem;">{% trans "No posts found for your query" %}</div>
        <p style="font-size:.82rem;color:rgba(255,255,255,.35);margin-bottom:1.3rem;">{% trans "Try a different keyword or remove the filters." %}</p>
        <button type="button"
                hx-get="{% url 'blog:post_search' %}"
                hx-target="#posts-container"
                hx-swap="innerHTML"
                onclick="document.querySelectorAll('[name=q]').forEach(el=>el.value='');document.querySelectorAll('#cmd-status,#cmd-sort').forEach(el=>el.selectedIndex=0);"
                style="display:inline-flex;align-items:center;gap:.5rem;padding:.45rem 1.1rem;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);border-radius:8px;color:#f87171;font-size:.8rem;font-weight:700;cursor:pointer;transition:background .15s;"
                onmouseover="this.style.background='rgba(220,38,38,.2)'" onmouseout="this.style.background='rgba(220,38,38,.1)'">
            <i class="fas fa-times-circle"></i> {% trans "Reset Filters" %}
        </button>
    </div>
{% endif %}
