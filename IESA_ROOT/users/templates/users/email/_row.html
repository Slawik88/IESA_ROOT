{% comment %}One label/value line of a details table. Needs: k, v.{% endcomment %}<tr>
  <td class="k" width="36%" valign="top" style="padding:13px 12px 13px 0;border-top:1px solid #26263a;font-size:12px;line-height:1.5;color:#8a8aa3;text-transform:uppercase;letter-spacing:.08em;font-weight:700;">{{ k }}</td>
  <td class="v" valign="top" style="padding:13px 0;border-top:1px solid #26263a;font-size:16px;line-height:1.5;color:#ffffff;font-weight:600;">{{ v }}</td>
</tr>
