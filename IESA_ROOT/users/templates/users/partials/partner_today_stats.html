{# V22: стили этого фрагмента вынесены в static/css/pages.css — <style> в HTMX-партиале реинжектится при каждом свапе #}
{% load i18n %}
{% comment %}7a: HTMX partial — статистика дня (polling every 60s). Рендерится вместо .dash-stat-grid при hx-swap="outerHTML".{% endcomment %}
<div class="dash-stat-grid"
     hx-get="{% url 'users:partner_today_stats' %}"
     hx-trigger="every 60s"
     hx-swap="outerHTML">

  {# Today's visits — с пульсирующей точкой если был визит за 30 минут #}
  <div class="dash-stat-card" style="position:relative;">
    <div class="dash-stat-icon ds-red" style="position:relative;">
      <i class="fas fa-calendar-day"></i>
      {% if has_recent %}
      <span class="stat-pulse-dot" title="{% trans 'Activity in last 30 min' %}"></span>
      {% endif %}
    </div>
    <div>
      <div class="dash-stat-val">{{ today_count }}</div>
      <div class="dash-stat-lbl">{% trans "Today's visits" %}</div>
    </div>
  </div>

  {# Today CHF #}
  <div class="dash-stat-card">
    <div class="dash-stat-icon ds-green"><i class="fas fa-coins"></i></div>
    <div>
      <div class="dash-stat-val">{{ today_revenue|floatformat:0 }}</div>
      <div class="dash-stat-lbl">{% trans "Today CHF" %}</div>
    </div>
  </div>

  {# Unique clients (all-time из context) #}
  <div class="dash-stat-card">
    <div class="dash-stat-icon ds-blue"><i class="fas fa-users"></i></div>
    <div>
      <div class="dash-stat-val">{{ unique_members }}</div>
      <div class="dash-stat-lbl">{% trans "Unique clients" %}</div>
    </div>
  </div>

  {# Total visits (all-time) #}
  <div class="dash-stat-card">
    <div class="dash-stat-icon ds-amber"><i class="fas fa-list-check"></i></div>
    <div>
      <div class="dash-stat-val">{{ total_visits }}</div>
      <div class="dash-stat-lbl">{% trans "Total visits" %}</div>
    </div>
  </div>

</div>
