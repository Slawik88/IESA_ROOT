{# V22: стили этого фрагмента вынесены в static/css/pages.css — <style> в HTMX-партиале реинжектится при каждом свапе #}
{% load static %}
{% load i18n %}

{% if search_results is not None %}
    {% if search_results %}
        <div class="psr-header fade-in">
            <span class="psr-label"><i class="fas fa-list me-1"></i>{% trans "Results" %}</span>
            <span class="psr-count">{{ search_results|length }}</span>
        </div>
        <div class="psr-list" id="search-results-list">
            {% for member in search_results %}
                <div class="psr-item fade-in-item" style="display:flex;align-items:center;gap:0;">
                  <a href="{% url 'users:log_visit' member.id %}" class="psr-item-inner" style="flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit;">
                    <div class="d-flex align-items-center gap-3" style="flex:1;">
                        {% if member.avatar and member.avatar.name != 'avatars/default.png' %}
                            <img src="{{ member.avatar.url }}" loading="lazy" alt="{{ member.username }}"
                                 class="psr-avatar">
                        {% else %}
                            <div class="psr-avatar-placeholder">
                                <i class="fas fa-user"></i>
                            </div>
                        {% endif %}
                        <div class="flex-grow-1">
                            <div class="psr-name">{{ member.first_name }} {{ member.last_name }}</div>
                            <div class="psr-meta">
                                <i class="fas fa-at me-1"></i>{{ member.username }}
                                {% if member.pseudonym %}
                                    &nbsp;·&nbsp;<i class="fas fa-tag me-1"></i>{{ member.pseudonym }}
                                {% endif %}
                            </div>
                            <div class="mt-1">
                                {% if member.membership_status == 'active' %}
                                    <span class="psr-badge psr-badge-active">
                                        <i class="fas fa-check-circle me-1"></i>{% trans "Active Member" %}
                                    </span>
                                {% else %}
                                    <span class="psr-badge psr-badge-inactive">
                                        <i class="fas fa-exclamation-circle me-1"></i>{% trans "Inactive" %}
                                    </span>
                                {% endif %}
                            </div>
                        </div>
                        <i class="fas fa-plus psr-arrow"></i>
                    </div>
                  </a>
                  <a href="{% url 'users:partner_member_visits' member.id %}"
                     title="{% trans 'Visit history' %}"
                     style="padding:12px 14px;color:rgba(255,255,255,.3);text-decoration:none;font-size:.8rem;border-left:1px solid rgba(255,255,255,.07);flex-shrink:0;"
                     onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='rgba(255,255,255,.3)'">
                    <i class="fas fa-history"></i>
                  </a>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="psr-alert psr-alert-warning fade-in">
            <h6><i class="fas fa-search-minus me-1"></i>{% trans "No Results Found" %}</h6>
            <p class="mb-0 mt-1">{% trans "Try searching with a different name, username, or member ID." %}</p>
        </div>
    {% endif %}
{% else %}
    <div class="psr-empty-hint fade-in">
        <i class="fas fa-info-circle fa-xl mb-3" style="color:rgba(220,38,38,.5);"></i>
        <p class="mb-0">{% trans "Enter member name, username, or ID to search" %}</p>
    </div>
{% endif %}
