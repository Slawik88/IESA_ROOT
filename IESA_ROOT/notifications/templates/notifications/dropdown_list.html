{% load i18n %}
{% if notifications %}
    <ul class="list-unstyled mb-0">
        {% for notification in notifications %}
        <li class="mb-2 pb-2 border-bottom">
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                    <p class="mb-1 small">{{ notification.message }}</p>
                    <small class="text-muted">{{ notification.created_at|timesince }} {% trans "ago" %}</small>
                </div>
                <button hx-delete="{% url 'notifications:notification_delete' notification.id %}"
                        hx-confirm="{% trans "Delete this notification?" %}"
                        class="btn btn-sm btn-link p-0 text-danger"
                        title="{% trans "Delete" %}">
                    ×
                </button>
            </div>
        </li>
        {% endfor %}
    </ul>
    <div class="mt-3 text-center">
        <a href="{% url 'notifications:notification_list' %}" class="btn btn-sm btn-outline-secondary">{% trans "View All" %}</a>
        <button hx-post="{% url 'notifications:mark_all_read' %}"
                hx-target="#notifications-content"
                class="btn btn-sm btn-outline-primary">
            {% trans "Mark as Read" %}
        </button>
    </div>
{% else %}
    <div class="text-center py-4 text-muted">
        <i class="fas fa-bell-slash mb-2"></i>
        <p>{% trans "No notifications yet" %}</p>
    </div>
{% endif %}
