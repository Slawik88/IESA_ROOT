{# V22: стили этого фрагмента вынесены в static/css/pages.css — <style> в HTMX-партиале реинжектится при каждом свапе #}
{% load i18n %}

{% if notifications %}
<div>
    {% for notification in notifications %}
    <div class="nd-item {% if not notification.is_read %}nd-unread{% endif %}">
        <div class="nd-icon
            {% if notification.notification_type == 'post_approved' %}nd-success
            {% elif notification.notification_type == 'post_rejected' %}nd-danger
            {% elif notification.notification_type == 'new_comment' or notification.notification_type == 'comment_reply' %}nd-info
            {% elif notification.notification_type == 'new_like' %}nd-warning
            {% elif notification.notification_type == 'new_follower' %}nd-primary
            {% else %}{% endif %}">
            {% if notification.notification_type == 'post_approved' %}<i class="fas fa-check"></i>
            {% elif notification.notification_type == 'post_rejected' %}<i class="fas fa-times"></i>
            {% elif notification.notification_type == 'new_comment' or notification.notification_type == 'comment_reply' %}<i class="fas fa-comment"></i>
            {% elif notification.notification_type == 'new_like' %}<i class="fas fa-heart"></i>
            {% elif notification.notification_type == 'new_follower' %}<i class="fas fa-user-plus"></i>
            {% elif notification.notification_type == 'event_reminder' %}<i class="fas fa-calendar-alt"></i>
            {% else %}<i class="fas fa-bell"></i>{% endif %}
        </div>
        <div style="flex:1;min-width:0;">
            <div class="nd-msg">{{ notification.message }}</div>
            <div class="nd-meta"><i class="fas fa-clock me-1"></i>{{ notification.created_at|timesince }} {% trans "ago" %}</div>
        </div>
        {% if not notification.is_read %}<div class="nd-unread-dot"></div>{% endif %}
        <button type="button" hx-delete="{% url 'notifications:notification_delete' notification.id %}"
                hx-confirm="{% trans "Delete this notification?" %}"
                class="nd-del" title="{% trans "Delete" %}">×</button>
    </div>
    {% endfor %}
</div>
<div class="nd-footer">
    <a href="{% url 'notifications:notification_list' %}" class="nd-btn"><i class="fas fa-list-ul"></i>{% trans "View All" %}</a>
    <button type="button" hx-post="{% url 'notifications:mark_all_read' %}"
            hx-target="#notifications-content"
            class="nd-btn nd-btn-red"><i class="fas fa-check-double"></i>{% trans "Mark Read" %}</button>
</div>
{% else %}
<div class="nd-empty">
    <i class="fas fa-bell-slash"></i>
    {% trans "No notifications yet" %}
</div>
{% endif %}
