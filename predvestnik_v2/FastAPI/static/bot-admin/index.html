<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Админка Предвестника</title>
<meta name="theme-color" content="#08090c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Тема применяется до отрисовки, чтобы светлая не мигала тёмной: по умолчанию как в Telegram, выбор хранится на устройстве.
(function(){try{var t='auto';try{t=(JSON.parse(localStorage.getItem('pv_admin_prefs')||'{}')||{}).theme||'auto';}catch(e){}
  if(t!=='light'&&t!=='dark'){var w=window.Telegram&&Telegram.WebApp,s=w&&w.platform&&w.platform!=='unknown'?w.colorScheme:'';
    t=s==='light'||s==='dark'?s:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}
  document.documentElement.dataset.theme=t==='light'?'light':'dark';}catch(e){}})();
</script>
<link rel="stylesheet" href="{{BASE}}/bot-admin/admin.css?v={{VER}}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap"/></noscript>
</head>
<body>
<header class="top">

  <div class="brand">🔮 Админка</div>
  <div class="who" id="who"></div>
</header>
<main id="main"><section class="admin-load" role="status" aria-live="polite">
  <div class="load-sigil" aria-hidden="true"><i></i><span>✦</span></div>
  <div class="load-copy"><small>Предвестник · синхронизация</small><h2>Открываем пульт</h2><p>Проверяем доступ и собираем разделы</p></div>
  <div class="load-map" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="load-stage"><i></i><span>Подключаемся к серверу</span></div>
</section></main>
<nav class="nav" id="tabs" aria-label="Разделы админки" hidden></nav>
<div class="sheet-back" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
