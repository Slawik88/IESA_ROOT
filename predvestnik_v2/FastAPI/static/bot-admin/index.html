<title>Админка Предвестника</title>
<meta name="theme-color" content="#08090c"/>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Тема применяется до отрисовки, чтобы светлая не мигала тёмной: по умолчанию как в Telegram, выбор хранится на устройстве.
(function(){try{var t='auto';try{t=(JSON.parse(localStorage.getItem('pv_admin_prefs')||'{}')||{}).theme||'auto';}catch(e){}
  if(t!=='light'&&t!=='dark'){var w=window.Telegram&&Telegram.WebApp,s=w&&w.platform&&w.platform!=='unknown'?w.colorScheme:'';
    t=s==='light'||s==='dark'?s:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}
  document.documentElement.dataset.theme=t==='light'?'light':'dark';}catch(e){}})();
</script>
