<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Предвестник</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="theme-color" content="#07080f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="{{BASE}}/static/app.css?v={{ASSET_VER}}"/>
</head>
<body>

<!-- ═══ ХЕДЕР: игрок + валюты (✨ с кнопкой пополнения — всегда на виду) ═══ -->
<header id="app-header">
  <div class="hdr-user" onclick="goTo('profile')">
    <div class="hdr-ava" id="hdr-ava">🔮</div>
    <div class="hdr-id">
      <div class="hdr-name" id="hdr-name">Игрок</div>
      <div class="hdr-sub" id="hdr-sub">…</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:5px">
    <div id="curr-bar" aria-label="Ваши валюты — нажмите для подробностей">
      <span class="cb-item"><span>🪙</span><span class="cb-val" id="cb-mora">0</span></span>
      <span class="cb-item"><span>💎</span><span class="cb-val" id="cb-dia">0.0</span></span>
      <span class="cb-item cb-zar"><span>✨</span><span class="cb-val" id="cb-zar">0</span>
        <button class="cb-plus" onclick="event.stopPropagation();goTo('market','vip')" aria-label="Пополнить">+</button>
      </span>
      <span class="cb-item" style="display:none"><span>🌑</span><span class="cb-val" id="cb-dark">0</span></span>
    </div>
    <button class="hdr-refresh" onclick="refreshPage()" aria-label="Обновить">🔄</button>
  </div>
</header>

<div id="toast" class="toast"></div>

<!-- ═══ ЛОГИН ═══ -->
<div id="login-ov" class="login-ov hidden">
  <div class="login-orb">🔮</div>
  <h1>Предвестник</h1>
  <p>Войдите через Telegram, чтобы открыть свой игровой профиль, питомцев и магазин.</p>
  <div id="tg-login-widget">
    <script src="https://telegram.org/js/telegram-widget.js?22"
            data-telegram-login="{{BOT_USERNAME}}" data-size="large" data-radius="14"
            data-onauth="onTelegramWidgetAuth(user)" data-request-access="write"></script>
  </div>
  <p style="font-size:10px;color:var(--dim)">Данные защищены подписью Telegram.</p>
</div>

<!-- ═══ МОДАЛКА → BOTTOM SHEET ═══ -->
<dialog id="modal">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="mhead"><span id="mt" class="mtitle"></span><button class="mclose" onclick="CM()">✕</button></div>
    <div id="mb" class="mbody"></div>
    <div id="mf" class="mfoot"></div>
  </div>
</dialog>

<!-- ═══ 1. ПРОФИЛЬ ═══ -->
<div id="pg-profile" class="page active">
  <div class="tabs">
    <button class="tb active" onclick="switchPro('main',this)">👤 Обзор</button>
    <button class="tb" onclick="switchPro('quests',this)">📋 Квесты</button>
    <button class="tb" onclick="switchPro('streak',this)">🔥 Стрик</button>
    <button class="tb" onclick="switchPro('ach',this)">🏆 Ачивки</button>
    <button class="tb" onclick="switchPro('bp',this)">🎫 Пропуск</button>
  </div>
  <div id="pro-main">
    <div class="sk" style="height:140px;border-radius:22px;margin-bottom:12px"></div>
    <div class="sk" style="height:70px;border-radius:16px"></div>
  </div>
  <div id="pro-quests" style="display:none"><div id="qc"></div></div>
  <div id="pro-streak" style="display:none"></div>
  <div id="pro-ach" style="display:none"></div>
  <div id="pro-bp" style="display:none"></div>
</div>

<!-- ═══ 2. ПИТОМЦЫ ═══ -->
<div id="pg-zoo" class="page">
  <div id="zoo-exp-wrap"></div>
  <div class="tabs">
    <button class="tb active" onclick="swZoo('nursery',this)">🐾 Питомник</button>
    <button class="tb" onclick="swZoo('storage',this)">📦 Склад</button>
    <button class="tb" onclick="swZoo('guide',this)">📖 Бестиарий</button>
  </div>
  <div id="zoo-c"></div>
</div>

<!-- ═══ 3. АРЕНА ═══ -->
<div id="pg-arena" class="page">
  <div class="tabs">
    <button class="tb active" onclick="swArena('duels',this)">⚔️ Дуэли</button>
    <button class="tb" onclick="swArena('events',this)">🎪 Ивенты</button>
  </div>
  <div id="ar-duels"><div id="dc"></div></div>
  <div id="ar-events" style="display:none"><div id="evc"></div></div>
</div>

<!-- ═══ 4. МАГАЗИН: премиум-витрина сразу после аукциона ═══ -->
<div id="pg-market" class="page">
  <div class="tabs">
    <button class="tb active" onclick="swMkt('auc',this)">🏛 Аукцион</button>
    <button class="tb" onclick="swMkt('vip',this)">✨ Премиум</button>
    <button class="tb" onclick="swMkt('shop',this)">🛒 Магазин</button>
    <button class="tb" onclick="swMkt('gacha',this)">🎲 Гача</button>
    <button class="tb" onclick="swMkt('craft',this)">⚗️ Крафт</button>
    <button class="tb" onclick="swMkt('inv',this)">🎒 Инвентарь</button>
    <button class="tb" onclick="swMkt('exch',this)">💱 Обмен</button>
    <button class="tb" onclick="swMkt('deal',this)">🏷 Акция</button>
    <button class="tb" onclick="swMkt('dark',this)">🌑 Тёмная</button>
  </div>
  <div id="balrow" class="balrow" style="display:none"></div>
  <div id="mkt-auc"><div class="loader">Загрузка...</div></div>
  <div id="mkt-shop"  style="display:none"></div>
  <div id="mkt-gacha" style="display:none"><div id="gc"></div></div>
  <div id="mkt-craft" style="display:none"><div id="cc"></div></div>
  <div id="mkt-inv"   style="display:none"></div>
  <div id="mkt-exch"  style="display:none"><div class="loader">Загрузка...</div></div>
  <div id="mkt-deal"  style="display:none"><div class="loader">Загрузка...</div></div>
  <div id="mkt-dark"  style="display:none"><div id="dkc"></div></div>
  <div id="mkt-vip"   style="display:none"><div class="loader">Загрузка...</div></div>
</div>

<!-- ═══ 5. КОЛЛЕКЦИЯ ═══ -->
<div id="pg-coll" class="page">
  <div class="tabs">
    <button class="tb active" onclick="swColl('themes',this)">🎨 Темы</button>
    <button class="tb" onclick="swColl('top',this)">🏆 Топ</button>
  </div>
  <div id="col-themes"><div class="loader">Загрузка...</div></div>
  <div id="col-top" style="display:none">
    <div class="tabs">
      <button class="tb active" onclick="switchTop('local',this)">🏘 Чат</button>
      <button class="tb" onclick="switchTop('global',this)">🌍 Глобально</button>
    </div>
    <div id="top-c"></div>
  </div>
</div>

<!-- ═══ 6. АДМИНКА ═══ -->
<div id="pg-admin" class="page">
  <div id="adm-chat-sel" style="margin-bottom:10px"></div>
  <div class="tabs">
    <button class="tb active" onclick="swAdmin('dash',this)">📊 Дашборд</button>
    <button class="tb" onclick="swAdmin('users',this)">👥 Участники</button>
    <button class="tb" onclick="swAdmin('bl',this)">🚫 ЧС</button>
    <button class="tb" onclick="swAdmin('mod',this)">⚡ Модерация</button>
    <button class="tb" onclick="swAdmin('settings',this)">⚙️ Настройки</button>
    <button class="tb" onclick="swAdmin('logs',this)">📋 Журнал</button>
  </div>
  <div id="adm-dash"></div>
  <div id="adm-users"    style="display:none"></div>
  <div id="adm-bl"       style="display:none"></div>
  <div id="adm-mod"      style="display:none"></div>
  <div id="adm-settings" style="display:none"></div>
  <div id="adm-logs"     style="display:none"></div>
</div>

<!-- ═══ 7. ГЛОБАЛЬНАЯ МОДЕРАЦИЯ ═══ -->
<div id="pg-global" class="page">
  <div class="tabs">
    <button class="tb active" onclick="swGlobal('chats',this)">💬 Все чаты</button>
    <button class="tb" onclick="swGlobal('sanctions',this)">🚫 Ограничения</button>
    <button class="tb" onclick="swGlobal('log',this)">📋 Журнал</button>
    <button class="tb" onclick="swGlobal('appeals',this)">📨 Апелляции</button>
    <button class="tb" id="glb-tab-ranks" style="display:none" onclick="swGlobal('ranks',this)">👮 Штат</button>
    <button class="tb" id="glb-tab-dev" style="display:none" onclick="swGlobal('dev',this)">🛠 Консоль</button>
  </div>
  <div id="glb-chats"></div>
  <div id="glb-sanctions" style="display:none"></div>
  <div id="glb-log"       style="display:none"></div>
  <div id="glb-appeals"   style="display:none"></div>
  <div id="glb-ranks"     style="display:none"></div>
  <div id="glb-dev"       style="display:none"></div>
</div>

<!-- ═══ НИЖНИЙ ДОК ═══ -->
<nav class="nav">
  <div class="nb active" onclick="switchPage('profile',this)"><span class="ni">👤</span>Профиль</div>
  <div class="nb" onclick="switchPage('zoo',this)"><span class="ni">🐾</span>Питомцы</div>
  <div class="nb" onclick="switchPage('arena',this)"><span class="ni">⚔️</span>Арена</div>
  <div class="nb" onclick="switchPage('market',this)"><span class="ni">🛍</span>Магазин</div>
  <div class="nb" onclick="switchPage('coll',this)"><span class="ni">🎨</span>Коллекция</div>
  <div class="nb" id="nb-admin" style="display:none" onclick="switchPage('admin',this)"><span class="ni">🛡</span>Адм.</div>
  <div class="nb" id="nb-global" style="display:none" onclick="switchPage('global',this)"><span class="ni">🌍</span>Модер.</div>
</nav>

<script src="{{BASE}}/static/app.js?v={{ASSET_VER}}"></script>
</body>
</html>
