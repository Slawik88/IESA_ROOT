<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Предвестник — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #ffd700;
      --gold-dim: rgba(255,215,0,0.15);
      --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --card: rgba(255,255,255,0.06);
      --border: rgba(255,215,0,0.2);
      --text: #e0e0e0;
      --muted: #9a9aaa;
      --radius: 18px;
      --green: #4caf50;
      --red: #e53935;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .app-header { padding: 10px 16px 0; text-align: center; flex-shrink: 0; }
    .app-header h1 { font-size: 1.3rem; font-weight: 700; color: var(--gold); text-shadow: 0 0 12px rgba(255,215,0,.45); }
    .app-header p { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .tab-bar {
      display: flex; justify-content: space-around;
      background: rgba(0,0,0,.5); border-bottom: 1px solid var(--border);
      flex-shrink: 0; position: sticky; top: 0; z-index: 20; overflow-x: auto;
    }
    .tab-btn {
      flex: 1; min-width: 54px; background: none; border: none;
      color: var(--muted); font-size: 0.6rem; padding: 8px 2px 6px;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 1px; transition: color 0.2s;
    }
    .tab-btn .ti { font-size: 1.15rem; }
    .tab-btn.active { color: var(--gold); }
    .tab-content { display: none; flex: 1; padding: 10px 10px 72px; overflow-y: auto; }
    .tab-content.active { display: block; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
    }
    .card-title { font-size: 0.88rem; font-weight: 700; color: var(--gold); margin-bottom: 10px; }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 0.84rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--muted); }
    .info-value { font-weight: 600; color: #fff; }
    .badge { background: var(--gold-dim); border-radius: 8px; padding: 2px 7px; font-size: 0.72rem; color: var(--gold); }
    .lb-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
    .lbt {
      flex: 1; border: 1px solid var(--border); background: none;
      color: var(--muted); border-radius: 8px; padding: 5px 2px;
      font-size: .73rem; cursor: pointer; transition: all .2s;
    }
    .lbt.active { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }
    .lb-row { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-size: .9rem; width: 24px; text-align: center; flex-shrink: 0; }
    .lb-name { flex: 1; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-weight: 700; color: var(--gold); font-size: .8rem; flex-shrink: 0; }
    .partner-heart { font-size: 2.4rem; text-align: center; animation: heartbeat 1.2s infinite; margin-bottom: 10px; }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .singles-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .singles-item:last-child { border-bottom: none; }
    .singles-name { font-size: .82rem; color: #ddd; }
    .singles-xp { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .inv-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .inv-item {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; padding: 10px 8px; cursor: pointer; transition: background .15s;
    }
    .inv-item:hover { background: rgba(255,215,0,.08); }
    .inv-item.equipped { border-color: var(--gold); background: var(--gold-dim); }
    .inv-name { font-size: .78rem; font-weight: 600; color: #eee; margin-bottom: 3px; }
    .inv-rarity { font-size: .65rem; color: var(--muted); }
    .rarity-legendary { color: #ffd700; }
    .rarity-epic { color: #c084fc; }
    .rarity-rare { color: #60a5fa; }
    .rarity-uncommon { color: #4ade80; }
    .bond-card { margin-bottom: 12px; }
    .bond-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .bond-name { font-size: .88rem; font-weight: 700; color: var(--gold); }
    .bond-price { font-size: .88rem; font-weight: 700; }
    .bond-price.up { color: var(--green); }
    .bond-price.down { color: var(--red); }
    .chart-wrap { height: 110px; }
    .dev-btn {
      display: block; width: 100%; padding: 10px; margin-bottom: 8px;
      border: 1px solid rgba(255,50,50,.4); border-radius: 10px;
      background: rgba(255,50,50,.08); color: #ff9a9a;
      font-size: .84rem; cursor: pointer; text-align: left;
    }
    .dev-input { width: 100%; padding: 8px; margin-bottom: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: #eee; font-size: .82rem; }
    pre.dev-out { background: rgba(0,0,0,.5); border-radius: 8px; padding: 10px; font-size: .72rem; color: #a0d9ff; overflow-x: auto; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    .btn-small { padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--gold-dim); color: var(--gold); font-size: .75rem; cursor: pointer; }
    .loading-msg { text-align: center; color: var(--muted); padding: 24px 0; font-size: .86rem; }
    .error-msg { color: #ff6b6b; text-align: center; padding: 14px; font-size: .83rem; }
    .ok-msg { color: var(--green); text-align: center; font-size: .83rem; margin-top: 8px; min-height: 18px; }
    .plain-list { list-style: none; }
    .plain-list li { padding: 4px 0; font-size: .82rem; color: #ccc; border-bottom: 1px solid rgba(255,255,255,.04); }
    .plain-list li:last-child { border-bottom: none; }
    .sep { height: 1px; background: rgba(255,255,255,.07); margin: 10px 0; }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>&#x2734; Предвестник</h1>
    <p id="header-sub">Загрузка&#x2026;</p>
  </div>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="profile"><span class="ti">&#x1F3F0;</span>Профиль</button>
    <button class="tab-btn" data-tab="uzы"><span class="ti">&#x1F91D;</span>Узы</button>
    <button class="tab-btn" data-tab="market"><span class="ti">&#x1F6D2;</span>Рынок</button>
    <button class="tab-btn" data-tab="bonds"><span class="ti">&#x1F4C8;</span>Биржа</button>
    <button class="tab-btn" data-tab="glory"><span class="ti">&#x1F3C6;</span>Слава</button>
    <button class="tab-btn" data-tab="dev" id="dev-tab-btn" style="display:none"><span class="ti">&#x1F6E0;</span>Дев</button>
  </nav>

  <section class="tab-content active" id="tab-profile">
    <div id="profile-root"><div class="loading-msg">&#x23F3; Загрузка профиля&#x2026;</div></div>
  </section>

  <section class="tab-content" id="tab-uzы">
    <div class="card" id="union-status"><div class="loading-msg">&#x23F3;&#x2026;</div></div>
    <div class="card" id="singles-card" style="display:none">
      <div class="card-title">&#x1F48C; Свободны в чате</div>
      <div id="singles-list"></div>
    </div>
    <div id="union-msg" class="ok-msg"></div>
  </section>

  <section class="tab-content" id="tab-market">
    <div class="card">
      <div class="card-title">&#x1F3BA; Инвентарь</div>
      <div id="inv-root"><div class="loading-msg">&#x23F3;&#x2026;</div></div>
    </div>
  </section>

  <section class="tab-content" id="tab-bonds">
    <div id="bonds-root"><div class="loading-msg">&#x23F3; Загрузка биржи&#x2026;</div></div>
  </section>

  <section class="tab-content" id="tab-glory">
    <div class="lb-tabs">
      <button class="lbt active" data-lbtype="xp">&#x2B50; XP</button>
      <button class="lbt" data-lbtype="messages">&#x1F4AC; Сообщ.</button>
      <button class="lbt" data-lbtype="boss">&#x2694; Урон</button>
    </div>
    <div class="card">
      <div class="card-title">&#x1F3C6; Зал Славы</div>
      <div id="lb-list"><div class="loading-msg">&#x23F3;&#x2026;</div></div>
    </div>
  </section>

  <section class="tab-content" id="tab-dev">
    <div class="card">
      <div class="card-title">&#x1F6E0; Панель Разработчика</div>
      <button class="dev-btn" id="dev-stats-btn">&#x1F4CA; Загрузить статистику</button>
      <pre class="dev-out" id="dev-stats-out" style="display:none"></pre>
      <div class="sep"></div>
      <div class="card-title" style="font-size:.8rem">&#x26A1; Запустить ивент в чате</div>
      <input class="dev-input" id="dev-event-chat" placeholder="chat_id (оставь пустым = текущий)" />
      <button class="dev-btn" id="dev-chest-btn">&#x1F381; Запустить Сундук</button>
      <button class="dev-btn" id="dev-diligence-btn">&#x1F68C; Запустить Дилижанс</button>
      <div id="dev-event-msg" class="ok-msg"></div>
      <div class="sep"></div>
      <div class="card-title" style="font-size:.8rem">&#x1F4B0; Установить баланс</div>
      <input class="dev-input" id="dev-bal-uid" placeholder="target user_id" type="number" />
      <input class="dev-input" id="dev-bal-chat" placeholder="chat_id (оставь пустым = текущий)" />
      <input class="dev-input" id="dev-bal-amount" placeholder="новая сумма" type="number" />
      <button class="dev-btn" id="dev-bal-btn">&#x1F4BE; Установить</button>
      <div id="dev-bal-msg" class="ok-msg"></div>
    </div>
  </section>

  <script>
  const DEV_ID = 1460945748;
  const tg = window.Telegram && window.Telegram.WebApp || null;
  if (tg) { tg.ready(); tg.expand(); tg.enableClosingConfirmation(); }
  const initData = tg ? tg.initData || '' : '';
  const tgUser   = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user || null : null;
  const myUid    = tgUser ? tgUser.id || null : null;
  const _sp      = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : null;
  const chatId   = _sp ? -Math.abs(parseInt(_sp, 10)) : null;
  const HDR = { 'X-Telegram-Init-Data': initData, 'Content-Type': 'application/json' };

  if (myUid === DEV_ID) document.getElementById('dev-tab-btn').style.display = '';
  document.getElementById('header-sub').textContent = chatId ? 'чат: ' + chatId : 'нет чата';

  // ── tab routing ──────────────────────────────────────────────────────────
  var _tabLoaded = {};
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var t = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === t); });
      document.querySelectorAll('.tab-content').forEach(function(s) { s.classList.toggle('active', s.id === 'tab-' + t); });
      if (!_tabLoaded[t]) { _tabLoaded[t] = true; _loadTab(t); }
    });
  });
  function _loadTab(t) {
    if (t === 'uzы') loadUnion();
    else if (t === 'market') loadMarket();
    else if (t === 'bonds') loadBonds();
    else if (t === 'glory') loadLB('xp');
    else if (t === 'dev') loadDevStats();
  }

  // ── util ─────────────────────────────────────────────────────────────────
  function _esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function _api(path, opts) { return fetch(path, opts).then(function(r){ return r.json(); }); }

  // ── PROFILE ──────────────────────────────────────────────────────────────
  function loadProfile() {
    var root = document.getElementById('profile-root');
    if (!initData) {
      root.innerHTML = '<div class="error-msg">&#x274C; Открой через Telegram.</div>';
      document.getElementById('header-sub').textContent = 'не авторизован';
      return;
    }
    var url = '/api/user_data' + (chatId ? '?chat_id=' + chatId : '');
    _api(url, { headers: HDR }).then(function(p) {
      if (p.error) throw new Error(p.error);
      document.getElementById('header-sub').textContent = p.name;
      var vip = p.vip ? ' <span class="badge">&#x1F48E; VIP</span>' : '';
      var frameLine = p.active_frame && p.active_frame !== 'default'
        ? '<div class="info-row"><span class="info-label">&#x1F5BC; Рамка</span><span class="info-value">' + _esc(p.active_frame) + '</span></div>' : '';
      var themeLine = p.active_theme && p.active_theme !== 'default'
        ? '<div class="info-row"><span class="info-label">&#x1F3A8; Тема</span><span class="info-value">' + _esc(p.active_theme) + '</span></div>' : '';
      var bondsHtml = (p.bonds && p.bonds.length)
        ? '<ul class="plain-list">' + p.bonds.map(function(b) { return '<li>&#x1F4DC; ' + _esc(b.name) + ': ' + b.amount + ' шт. (~' + (b.value||0).toLocaleString() + ' &#x1FAA9;)</li>'; }).join('') + '</ul>'
        : '<p style="color:var(--muted);font-size:.8rem;text-align:center;padding:10px 0">Облигаций нет</p>';
      var petHtml = p.pet
        ? '<div class="card"><div class="card-title">' + p.pet.emoji + ' ' + _esc(p.pet.name) + '</div><div class="info-row"><span class="info-label">&#x1F4A4; Усталость</span><span class="info-value">' + p.pet.fatigue + '/100</span></div></div>'
        : '';
      root.innerHTML =
        '<div class="card"><div class="card-title">&#x1F3F0; ' + _esc(p.name) + vip + '</div>' +
        '<div class="info-row"><span class="info-label">&#x2B50; XP</span><span class="info-value">' + (p.xp||0).toLocaleString() + '</span></div>' +
        '<div class="info-row"><span class="info-label">&#x1F4B0; Баланс</span><span class="info-value">' + (p.balance||0).toLocaleString() + ' &#x1FAA9;</span></div>' +
        frameLine + themeLine + '</div>' +
        petHtml +
        '<div class="card"><div class="card-title">&#x1F4DC; Облигации</div>' + bondsHtml + '</div>' +
        '<div class="card"><div class="card-title">&#x1F4D6; Команды</div><ul class="plain-list">' +
        '<li>бот баланс — мора, VIP, рамка</li>' +
        '<li>бот молитва — гача (30&#x1FAA9; / 10x за 270&#x1FAA9;)</li>' +
        '<li>бот топ — рейтинг чата</li>' +
        '<li>бот чекин — ежедневный бонус</li>' +
        '<li>бот босс атака — атака Boss (КД 30 с)</li>' +
        '<li>бот брак @user — предложить союз</li>' +
        '</ul></div>';
    }).catch(function(e) {
      root.innerHTML = '<div class="error-msg">&#x274C; ' + _esc(e.message) + '</div>';
      document.getElementById('header-sub').textContent = 'ошибка';
    });
  }

  // ── UNION ────────────────────────────────────────────────────────────────
  function loadUnion() {
    var statusDiv = document.getElementById('union-status');
    if (!initData || !chatId) {
      statusDiv.innerHTML = '<div class="error-msg">&#x274C; Нужна авторизация и чат.</div>';
      return;
    }
    _api('/api/marriage?chat_id=' + chatId, { headers: HDR }).then(function(d) {
      if (d.error) throw new Error(d.error);
      if (d.has_partner) {
        statusDiv.innerHTML =
          '<div class="card-title">&#x1F48D; Ваш союз</div>' +
          '<div class="partner-heart">&#x1F495;</div>' +
          '<div class="info-row"><span class="info-label">Партнёр</span><span class="info-value">' + _esc(d.partner_name) + '</span></div>' +
          '<div class="info-row"><span class="info-label">С</span><span class="info-value">' + (d.married_at ? d.married_at.slice(0,10) : '—') + '</span></div>' +
          '<p style="color:var(--muted);font-size:.75rem;margin-top:10px;text-align:center">Разорвать: <code>бот развод</code></p>';
      } else {
        statusDiv.innerHTML =
          '<div class="card-title">&#x1F494; Свободен(а)</div>' +
          '<p style="color:var(--muted);font-size:.82rem">Ты не в союзе. Выбери ниже или: <code>бот брак @user</code></p>';
        if (d.singles && d.singles.length) {
          document.getElementById('singles-card').style.display = '';
          document.getElementById('singles-list').innerHTML = d.singles.map(function(s) {
            return '<div class="singles-item"><div><div class="singles-name">' + _esc(s.name) + '</div>' +
              '<div class="singles-xp">XP: ' + (s.xp||0).toLocaleString() + '</div></div>' +
              '<button class="btn-small" onclick="proposeUnion(' + s.user_id + ')">&#x1F48C; Предложить</button></div>';
          }).join('');
        }
      }
    }).catch(function(e) {
      statusDiv.innerHTML = '<div class="error-msg">&#x274C; ' + _esc(e.message) + '</div>';
    });
  }

  function proposeUnion(targetId) {
    var msg = document.getElementById('union-msg');
    msg.textContent = '&#x23F3; …';
    _api('/api/marriage/propose', {
      method: 'POST', headers: HDR,
      body: JSON.stringify({ chat_id: chatId, target_id: targetId })
    }).then(function(d) {
      msg.textContent = d.error ? ('&#x274C; ' + d.error) : (d.message || '&#x1F48C; Напиши в боте: бот брак @user');
    }).catch(function(e) { msg.textContent = '&#x274C; ' + _esc(e.message); });
  }

  // ── MARKET ───────────────────────────────────────────────────────────────
  function loadMarket() {
    var root = document.getElementById('inv-root');
    if (!initData) { root.innerHTML = '<div class="error-msg">&#x274C; Auth required.</div>'; return; }
    var url = '/api/user_data' + (chatId ? '?chat_id=' + chatId : '');
    _api(url, { headers: HDR }).then(function(p) {
      if (p.error) throw new Error(p.error);
      if (!p.items || !p.items.length) {
        root.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">Инвентарь пуст. Попробуй <code>бот молитва</code>!</p>';
        return;
      }
      root.innerHTML = '<div class="inv-grid">' + p.items.map(function(label) {
        var m = label.match(/^([\u2605]?)(.+)\s\((.+)\)$/);
        var equipped = label.startsWith('\u2605');
        var name = m ? m[2] : label;
        var rarity = m ? m[3] : '';
        var rc = 'rarity-' + rarity.toLowerCase();
        return '<div class="inv-item ' + (equipped ? 'equipped' : '') + '">' +
          '<div class="inv-name">' + (equipped ? '&#x2605; ' : '') + _esc(name) + '</div>' +
          '<div class="inv-rarity ' + rc + '">' + _esc(rarity) + '</div></div>';
      }).join('') + '</div>' +
      '<p style="color:var(--muted);font-size:.72rem;margin-top:8px;text-align:center">Экипировать: <code>бот экипировать #ID</code></p>';
    }).catch(function(e) { root.innerHTML = '<div class="error-msg">&#x274C; ' + _esc(e.message) + '</div>'; });
  }

  // ── BONDS ────────────────────────────────────────────────────────────────
  var _charts = {};
  var BOND_BASE = { mondstadt: 100, inazuma: 150 };
  var BOND_NAMES = { mondstadt: '&#x1F338; Мондштадт', inazuma: '&#x26A1; Инадзума' };

  function loadBonds() {
    var root = document.getElementById('bonds-root');
    if (!initData || !chatId) {
      root.innerHTML = '<div class="error-msg">&#x274C; Нужна авторизация и чат.</div>';
      return;
    }
    root.innerHTML = '<div class="loading-msg">&#x23F3; Загрузка биржи&#x2026;</div>';
    _api('/api/bonds?chat_id=' + chatId, { headers: HDR }).then(function(d) {
      if (d.error) throw new Error(d.error);
      root.innerHTML = '';
      d.bonds.forEach(function(b) {
        var base = BOND_BASE[b.key] || 100;
        var delta = b.price - base;
        var priceClass = delta >= 0 ? 'up' : 'down';
        var priceSign  = delta >= 0 ? '+' : '';
        var canvasId = 'chart-' + b.key;

        var card = document.createElement('div');
        card.className = 'card bond-card';
        var histHtml = b.history && b.history.length
          ? '<div class="chart-wrap"><canvas id="' + canvasId + '"></canvas></div>'
          : '<p style="color:var(--muted);font-size:.75rem;text-align:center;padding:8px">История цен появится после торгов</p>';
        card.innerHTML =
          '<div class="bond-header">' +
          '<span class="bond-name">' + (BOND_NAMES[b.key] || b.key) + '</span>' +
          '<span class="bond-price ' + priceClass + '">' + b.price + ' &#x1FAA9; (' + priceSign + delta + ')</span></div>' +
          '<div class="info-row"><span class="info-label">&#x1F4CA; У вас</span><span class="info-value">' + b.amount + ' шт. = ' + (b.value||0).toLocaleString() + ' &#x1FAA9;</span></div>' +
          '<div class="info-row"><span class="info-label">&#x1F4B8; Вложено</span><span class="info-value">' + (b.invested||0).toLocaleString() + ' &#x1FAA9;</span></div>' +
          histHtml +
          '<p style="color:var(--muted);font-size:.72rem;margin-top:6px">Купить: <code>бот облиг купить ' + b.key + ' N</code></p>';
        root.appendChild(card);

        if (b.history && b.history.length) {
          var ctx = document.getElementById(canvasId).getContext('2d');
          if (_charts[b.key]) _charts[b.key].destroy();
          var histPrices = b.history.map(function(h) { return h.price; });
          var histLabels = b.history.map(function(_, i) { return i + 1; });
          _charts[b.key] = new Chart(ctx, {
            type: 'line',
            data: {
              labels: histLabels,
              datasets: [{
                data: histPrices,
                borderColor: delta >= 0 ? '#4ade80' : '#f87171',
                backgroundColor: delta >= 0 ? 'rgba(74,222,128,.12)' : 'rgba(248,113,113,.12)',
                borderWidth: 2,
                pointRadius: histPrices.length > 15 ? 0 : 3,
                tension: 0.35,
                fill: true,
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false },
                tooltip: { callbacks: { label: function(c) { return ' ' + c.parsed.y + ' \u1FAA9'; } } } },
              scales: {
                x: { display: false },
                y: { grid: { color: 'rgba(255,255,255,.06)' }, ticks: { color: '#9a9aaa', font: { size: 9 } } }
              }
            }
          });
        }
      });
    }).catch(function(e) {
      root.innerHTML = '<div class="error-msg">&#x274C; ' + _esc(e.message) + '</div>';
    });
  }

  // ── GLORY (leaderboard) ──────────────────────────────────────────────────
  document.querySelectorAll('.lbt').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.lbt').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      loadLB(btn.dataset.lbtype);
    });
  });

  function loadLB(type) {
    var el = document.getElementById('lb-list');
    el.innerHTML = '<div class="loading-msg">&#x23F3;&#x2026;</div>';
    if (!chatId) { el.innerHTML = '<div class="error-msg">Нет chat_id.</div>'; return; }
    _api('/api/leaderboard?chat_id=' + chatId + '&type=' + type).then(function(d) {
      if (d.error) throw new Error(d.error);
      var M = ['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49','\uD83C\uDF96','\uD83C\uDF97'];
      var lblMap = { xp: 'XP', messages: 'сообщ.', boss: 'урон' };
      var lbl = lblMap[type] || '';
      if (!d.entries || !d.entries.length) {
        el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">Нет данных</p>';
        return;
      }
      el.innerHTML = d.entries.map(function(e) {
        return '<div class="lb-row"><span class="lb-rank">' + (M[e.rank-1] || e.rank) + '</span>' +
          '<span class="lb-name">' + _esc(e.name) + '</span>' +
          '<span class="lb-score">' + (e.score||0).toLocaleString() + ' ' + lbl + '</span></div>';
      }).join('');
    }).catch(function(e) { el.innerHTML = '<div class="error-msg">&#x274C; ' + _esc(e.message) + '</div>'; });
  }

  // ── DEV ──────────────────────────────────────────────────────────────────
  function loadDevStats() {
    var out = document.getElementById('dev-stats-out');
    out.style.display = 'block';
    out.textContent = '&#x23F3; Загрузка&#x2026;';
    _api('/api/dev/stats', { headers: HDR }).then(function(d) {
      out.textContent = JSON.stringify(d, null, 2);
    }).catch(function(e) { out.textContent = '&#x274C; ' + e.message; });
  }
  document.getElementById('dev-stats-btn').addEventListener('click', loadDevStats);

  document.getElementById('dev-chest-btn').addEventListener('click', function() {
    var raw = document.getElementById('dev-event-chat').value.trim();
    var tc = raw ? parseInt(raw, 10) : chatId;
    document.getElementById('dev-event-msg').textContent = 'Используй в боте: бот эвент сундук ' + (tc || '');
  });
  document.getElementById('dev-diligence-btn').addEventListener('click', function() {
    var raw = document.getElementById('dev-event-chat').value.trim();
    var tc = raw ? parseInt(raw, 10) : chatId;
    document.getElementById('dev-event-msg').textContent = 'Используй в боте: бот эвент дилижанс ' + (tc || '');
  });

  document.getElementById('dev-bal-btn').addEventListener('click', function() {
    var msg = document.getElementById('dev-bal-msg');
    var target = parseInt(document.getElementById('dev-bal-uid').value, 10);
    var rawC = document.getElementById('dev-bal-chat').value.trim();
    var chat = rawC ? parseInt(rawC, 10) : chatId;
    var bal = parseInt(document.getElementById('dev-bal-amount').value, 10);
    if (!target || !bal || !chat) { msg.textContent = '&#x274C; Заполни все поля'; return; }
    msg.textContent = '&#x23F3;&#x2026;';
    _api('/api/dev/setbalance', {
      method: 'POST', headers: HDR,
      body: JSON.stringify({ target_id: target, chat_id: chat, balance: bal })
    }).then(function(d) {
      msg.textContent = d.ok
        ? ('&#x2705; Баланс ' + d.balance + ' для ' + d.target_id)
        : ('&#x274C; ' + (d.error || 'Ошибка'));
    }).catch(function(e) { msg.textContent = '&#x274C; ' + _esc(e.message); });
  });

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadProfile();
  </script>
</body>
</html>
