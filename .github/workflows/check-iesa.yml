name: Check IESA website

on:
  push:
    paths: ['IESA_ROOT/**', 'requirements.txt', '.github/workflows/check-iesa.yml']
  pull_request:
    paths: ['IESA_ROOT/**', 'requirements.txt', '.github/workflows/check-iesa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iesa
          POSTGRES_PASSWORD: iesa-ci-only
          POSTGRES_DB: iesa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iesa -d iesa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: '1'
      DJANGO_SETTINGS_MODULE: IESA_ROOT.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: IESA_ROOT/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install website dependencies and checker
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r IESA_ROOT/requirements.txt ruff==0.17.1
      - name: Static checks, migrations and SQLite regression tests
        working-directory: IESA_ROOT
        run: python scripts/check_site.py
      - name: PostgreSQL regression and concurrency tests
        working-directory: IESA_ROOT
        env:
          IESA_TEST_DATABASE_URL: postgresql://iesa:iesa-ci-only@127.0.0.1:5432/iesa_ci
        run: python manage.py test core blog products gallery notifications users --noinput
